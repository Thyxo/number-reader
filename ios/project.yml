# XcodeGen-projekt (der committes ingen .xcodeproj): `xcodegen` i ios/ laver NumberReader.xcodeproj.
name: NumberReader
options:
  bundleIdPrefix: dk.thyxo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  NumberReader:
    type: application
    platform: iOS
    sources:
      - path: NumberReader
    info:
      path: NumberReader/Info.plist
      properties:
        CFBundleDisplayName: Telefon
        CFBundleName: Telefon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: da
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Kameraet bruges til at læse tal.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dk.thyxo.numberreader
        PRODUCT_NAME: NumberReader
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual
